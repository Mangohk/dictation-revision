<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictation Tools</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/hub.css" />
  </head>
  <body class="hub-page">
    <div class="hub-atmosphere" aria-hidden="true"></div>
    <p class="hub-updated">Updated 30 Sep 2026</p>

    <div class="wrap">
      <header class="hub-hero">
        <h1>Dictation Tools</h1>
        <p class="hub-lead">Calm self-study before your next dictation.</p>
        <p class="sub">
          Choose a year level, then open a practice studio to revise on your own.
        </p>
      </header>

      <div class="filter-bar" role="group" aria-label="Year level">
        <button type="button" class="filter-btn" data-filter="all" aria-pressed="false">All</button>
        <button type="button" class="filter-btn" data-filter="p5" aria-pressed="false">Primary 5</button>
      </div>

      <nav id="dictationNav" aria-label="Dictations by year level"></nav>

      <p class="hint">
        Self-study tip: open a studio, listen to the words and passage, then practise until you feel ready.
      </p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
